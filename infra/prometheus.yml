global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "marga-services"
    static_configs:
      - targets:
          - "host.docker.internal:8000"   # fusion-engine
          - "host.docker.internal:8001"   # risk-engine
          - "host.docker.internal:8002"   # alert-gateway

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
