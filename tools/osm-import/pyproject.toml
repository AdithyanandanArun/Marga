[project]
name = "marga-osm-import"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "osmium>=3.7",
]

[project.scripts]
marga-osm-import = "marga_osm_import.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
