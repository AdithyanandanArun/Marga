[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marga"
version = "0.1.0"
requires-python = ">=3.12"
description = "Marga V2X — India-ready vehicle-to-everything safety platform"
dependencies = [
    "marga-schemas",
    "marga-osm-import",
]

[tool.uv.workspace]
members = [
    "packages/schemas",
    "tools/osm-import",
]

[tool.uv.sources]
marga-schemas = { workspace = true }
marga-osm-import = { workspace = true }

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
