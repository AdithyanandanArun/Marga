[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marga-persistence"
version = "0.1.0"
description = "Marga persistence layer — async SQLAlchemy + PostGIS + Alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.0",
    "marga-schemas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20.0",
]
