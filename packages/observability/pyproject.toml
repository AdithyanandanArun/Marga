[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marga-observability"
version = "0.1.0"
description = "Marga observability — Prometheus metrics, OpenTelemetry tracing, decision traces, health checks"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.111.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
