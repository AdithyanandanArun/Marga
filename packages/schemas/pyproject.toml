[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marga-schemas"
version = "0.1.0"
requires-python = ">=3.12"
description = "Canonical Pydantic v2 schemas for the Marga V2X platform"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["marga_schemas"]
