name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. Block forbidden Co-authored-by trailers ──────────────────
  co-author-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Co-authored-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash infra/scripts/check-coauthor.sh

  # ── 2. Lint & type-check ────────────────────────────────────────
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" -e ./packages/schemas -e ./tools/osm-import -e "./packages/persistence[dev]" -e "./packages/observability[fastapi]"

      - name: Ruff check
        run: >-
          ruff check packages/schemas/marga_schemas packages/persistence packages/observability
          services/hazards services/trust services/messaging services/alerts services/gateway
          tests/contract/test_schemas.py tests/unit/test_alerts.py tests/unit/test_hazard_fusion.py
          tests/unit/test_messaging.py tests/unit/test_persistence.py tests/unit/test_trust.py

      - name: Mypy
        run: >-
          mypy packages/schemas/marga_schemas packages/persistence packages/observability
          services/hazards services/trust services/messaging services/alerts services/gateway

  # ── 3. Test suite ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: marga
          POSTGRES_PASSWORD: marga
          POSTGRES_DB: marga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://marga:marga@localhost:5432/marga

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" -e ./packages/schemas -e ./tools/osm-import -e "./packages/persistence[dev]" -e "./packages/observability[fastapi]"

      - name: Run Alembic migrations
        run: alembic -c packages/persistence/alembic.ini upgrade head

      - name: Verify migration schema
        env:
          DATABASE_URL: postgresql+asyncpg://marga:marga@localhost:5432/marga
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def check():
              engine = create_async_engine('postgresql+asyncpg://marga:marga@localhost:5432/marga')
              async with engine.connect() as conn:
                  result = await conn.execute(text(
                      \"SELECT table_name FROM information_schema.tables \"
                      \"WHERE table_schema = 'public' ORDER BY table_name\"
                  ))
                  tables = {row[0] for row in result}
                  expected = {'hazards', 'hazard_observations', 'incidents', 'alerts', 'trust_events', 'system_audit_events'}
                  missing = expected - tables
                  if missing:
                      raise AssertionError(f'Missing tables: {missing}')

                  result = await conn.execute(text('SELECT PostGIS_Version()'))
                  version = result.scalar()
                  print(f'PostGIS version: {version}')

                  result = await conn.execute(text(
                      \"SELECT indexname FROM pg_indexes WHERE indexname LIKE 'ix_%'\"
                  ))
                  indices = [row[0] for row in result]
                  print(f'Indices: {indices}')

                  print(f'All {len(expected)} tables verified')
              await engine.dispose()

          asyncio.run(check())
          "

      - name: Verify Alembic downgrade
        run: alembic -c packages/persistence/alembic.ini downgrade base

      - name: Re-upgrade for tests
        run: alembic -c packages/persistence/alembic.ini upgrade head

      - name: Run tests with coverage
        run: pytest --tb=short -q --cov=services --cov=packages --cov-report=term-missing

  # ── 4. Schema contract tests ────────────────────────────────────
  schema-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" -e ./packages/schemas -e ./tools/osm-import -e "./packages/persistence[dev]" -e "./packages/observability[fastapi]"

      - name: Run contract tests
        run: pytest tests/contract --tb=short -q

  # ── 5. Docker build (no push) ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t marga-backend:ci-${{ github.sha }} .

  # ── 6. Security audit ──────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" -e ./packages/schemas -e ./tools/osm-import -e "./packages/persistence[dev]" -e "./packages/observability[fastapi]"
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit
